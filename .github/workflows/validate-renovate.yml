name: Validate Renovate presets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  RENOVATE_VERSION: 44.30.3

jobs:
  validate:
    runs-on: ci-standard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Validate Renovate config
        run: npx --yes --package renovate@${RENOVATE_VERSION} -- renovate-config-validator --no-global renovate.json default.json automerge.json
